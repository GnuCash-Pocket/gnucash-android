[libraries]
android-test-core = { module = "androidx.test:core-ktx", version.ref = "android-test-core" }
android-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-ext-junit" }
android-test-rules = { module = "androidx.test:rules", version.ref = "android-test-rules" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "android-test-uiautomator" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime" }
apache-http = { module = "commons-httpclient:commons-httpclient", version.ref = "apache-http" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
betterpickers = { module = "com.code-troopers.betterpickers:library", version.ref = "betterpickers" }
chart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "chart" }
crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "crashlytics" }
dropbox = { module = "com.dropbox.core:dropbox-android-sdk", version.ref = "dropbox" }
espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "android-test-espresso" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "android-test-espresso" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "android-test-espresso" }
evalex = { module = "com.ezylang:EvalEx", version.ref = "evalex" }
exp4j = { module = "net.objecthunter:exp4j", version.ref = "exp4j" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
joda-time = { module = "joda-time:joda-time", version.ref = "joda-time" }
junit = { module = "junit:junit", version.ref = "junit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
nextcloud = { module = "com.github.nextcloud:android-library", version.ref = "nextcloud" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
times-square = { module = "com.squareup:android-times-square", version.ref = "times-square" }
wizardpager = { module = "com.github.techfreak:wizardpager", version.ref = "wizardpager" }

[bundles]
android-test = [
    "android-test-core",
    "android-test-ext-junit",
    "android-test-rules",
    "android-test-runner",
    "android-test-uiautomator"
]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-lifecycle-viewmodel-compose"
]
espresso = ["espresso-core", "espresso-intents", "espresso-contrib"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-plugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.21" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
